app:
  name: "ZenBiz MCP Manager"
  provider: "Zen Business Solutions"
  host: "0.0.0.0"
  port: 8000
  public_base_url: "http://localhost:8000"
  log_level: "INFO"

management_api:
  enabled: true
  admin_api_key_env: "ADMIN_API_KEY"

gateway:
  public_path: "/mcp"
  authentication:
    # opaque_token = simple per-client bearer token
    # jwt = resolve tenant from a verified JWT tenant claim
    mode: "opaque_token"

    jwt:
      enabled: false
      issuer_env: "GATEWAY_JWT_ISSUER"
      audience_env: "GATEWAY_JWT_AUDIENCE"
      jwks_url_env: "GATEWAY_JWT_JWKS_URL"
      algorithms:
        - "RS256"
      tenant_claim: "tenant_id"

clients:
  directory: "config/clients"
